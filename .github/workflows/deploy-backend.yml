name: Deploy backend to Railway

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Check RAILWAY_TOKEN secret
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret is not set - skipping deploy."
            echo "Create a project token: Railway dashboard -> portfolio-backend -> Settings -> Tokens"
            echo "Then: gh secret set RAILWAY_TOKEN --repo Ulugbek-Kudratullayev/portfolio"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        id: guard

      - uses: actions/checkout@v4
        if: env.RAILWAY_TOKEN != ''

      - name: Install Railway CLI
        if: env.RAILWAY_TOKEN != ''
        run: npm install -g @railway/cli

      - name: Deploy
        if: env.RAILWAY_TOKEN != ''
        working-directory: backend
        run: railway up --service portfolio-api --detach
